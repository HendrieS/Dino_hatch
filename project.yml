name: DinoHatch
options:
  bundleIdPrefix: com.dinohatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

targets:
  DinoHatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DinoHatch
      - path: DinoHatchShared
    info:
      path: DinoHatch/Info.plist
      properties:
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: DinoHatch/DinoHatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dinohatch.app
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.dinohatch.app
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinohatch.app
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "icon-trex icon-triceratops icon-pteranodon icon-patagotitan"
    dependencies:
      - target: DinoHatchWidget
        embed: true

  DinoHatchWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DinoHatchWidget
      - path: DinoHatchShared
      - path: DinoHatch/Localizable.xcstrings
      - path: DinoHatch/Assets.xcassets
    info:
      path: DinoHatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Dino Hatch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DinoHatchWidget/DinoHatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dinohatch.app
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.dinohatch.app
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinohatch.app.widget
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO

  DinoHatchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DinoHatchTests
    dependencies:
      - target: DinoHatch
    settings:
      base:
        SWIFT_VERSION: "5.0"

schemes:
  DinoHatch:
    build:
      targets:
        DinoHatch: all
        DinoHatchWidget: all
        DinoHatchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DinoHatchTests
    archive:
      config: Release
